			<section class="firstSection">
				<h2>
					Template
				</h2>
				<div class="singleFigure">
					<figure>
						<template>

						</template>
						<figcaption>
							Figure 1: Template Tag
						</figcaption>
						<p class="objectExplanation"> 
							Used to show content that is normally hidden. <br>
							Does not work due to no JS.
						</p>
					</figure>
				</div>
			</section>
			<hr>
			<section class="showOffs">
				<h2>
					Audio
				</h2>
				<div class="singleFigure">

					<figure>
						<audio controls>
							<source src="../audio/Chateau.mp3" type="audio/mpeg">
						</audio>

						<figcaption> Figure 2: A tag that plays audio files</figcaption>
					</figure>
				</div>
			</section>
			<hr>
			<section class="showOffs">
				<h2>
					Canvas
				</h2>
				<div class="singleFigure">

					<figure>
						<canvas id="myCanvas">
							Turn on JS to get this to work!
						</canvas>

						<figcaption> Figure 3: A canvas that can be drawn on</figcaption>
					</figure>
					<script>
						const canvas = document.getElementById("myCanvas");
						const ctx = canvas.getContext("2d");
						ctx.fillStyle = "purple";
						ctx.fillRect(0, 300, 0, 150)
						ctx.fillStyle = "Green";
						ctx.fillRect(30, 50, 140, 80);
						ctx.fillStyle = "orange";
						ctx.fillRect(85, 50, 40, 80);
					</script>
				</div>

			</section>
			<hr>
			<section>
				<h2>

							white claws, jumping high in the air with one arm outstretched."
							>

					</figure>
				</div>

							</msup>

						<p>
							Not used until recently since Chrome didn't support it for 
							the longest due to instability and security concerns. 
						</p>
					</figure>
				</div>
